<div class="pokemon-container">
  @if (pokemonList$ | async; as list) {
    @if (list.length > 0) {
      <ul>
        @for (p of list; track p._id) {
          <li>
            <img [src]="p.img" [alt]="p.name" class="title">
          </li>
        }
      </ul>
    } @else {
      <p>The Pokédex is currently empty.</p>
    }
  } @else {
    <div class="loader">Searching the tall grass for Pokémon...</div>
  }
</div>
