<div class="profile-container" *ngIf="dresseur">
  <div class="profile-card">
    <div class="avatar-circle">
      <img src="assets/trainer-icon.png" alt="Avatar">
    </div>
    
    <h2>Profil du Dresseur</h2>
    
    <div class="info-group">
      <label>Pseudo</label>
      <p>{{ dresseur.pseudo }}</p>
    </div>

    <div class="info-group">
      <label>Email</label>
      <p>{{ dresseur.email }}</p>
    </div>

    <button (click)="logout()" class="btn-logout">Se déconnecter</button>
  </div>
</div>
