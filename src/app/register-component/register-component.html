<div class="login-wrapper">
  <div class="login-column">
    
    <div class="title-container">
      <h1>INSCRIPTION</h1>
    </div>

    <form class="form-content">
      <div class="input-group">
        <label for="username">NOM DE DRESSEUR</label>
        <input type="text" id="username" placeholder="Ex: Sacha02">
      </div>

      <div class="input-group">
        <label for="email">ADRESSE EMAIL</label>
        <input type="email" id="email" placeholder="pika@pemail.com">
      </div>

      <div class="input-group">
        <label for="password">MOT DE PASSE</label>
        <input type="password" id="password" placeholder="********">
      </div>

      <div class="input-group">
        <label for="confirm">CONFIRMER LE MOT DE PASSE</label>
        <input type="password" id="confirm" placeholder="********">
      </div>
    </form>

    <div class="button-footer">
      <button type="submit" class="btn-grey">Créer mon compte</button>
      
      <p class="switch-link">
        Déjà dresseur ? <a routerLink="/login">Connecte-toi !</a>
      </p>
    </div>

  </div>
</div>
